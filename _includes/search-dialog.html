<div class="dialog-backdrop" id="search-dialog" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="dialog">
    <div class="search__field">
      {% include icon.html name="search" size="16" %}
      <input type="search" class="search__input" id="search-input" placeholder="Search posts, thoughts, artwork…" autocomplete="off" spellcheck="false">
      <span class="search__esc">ESC</span>
    </div>
    <div class="search__results" id="search-results">
      <p class="search__empty">Type to search — posts, thoughts and artwork.</p>
    </div>
  </div>
</div>
