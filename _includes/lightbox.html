<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full size image" hidden>
  <img class="lightbox__img" id="lightbox-img" src="" alt="">
  <button type="button" class="lightbox__close" data-lightbox-close aria-label="Close">✕</button>
  <div class="lightbox__zoom">
    <button type="button" data-zoom="-1" aria-label="Zoom out">−</button>
    <span class="lightbox__pct" id="lightbox-pct">100%</span>
    <button type="button" data-zoom="1" aria-label="Zoom in">+</button>
  </div>
</div>
