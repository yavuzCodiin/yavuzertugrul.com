<header class="topbar">
  <a class="topbar__brand" href="{{ '/' | relative_url }}">
    <span class="brand__name">Yavuz Ertuğrul</span>
    <span class="brand__kicker">{{ site.tagline }}</span>
  </a>
  <div class="topbar__actions">
    <button type="button" class="topbar__btn" data-search-open aria-label="Search">
      {% include icon.html name="search" size="18" %}
    </button>
    <button type="button" class="topbar__burger" data-menu-toggle aria-label="Menu" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span>
    </button>
  </div>
</header>

<div class="menu" id="site-menu" hidden>
  <div class="menu__head">
    <span class="brand__name">Yavuz Ertuğrul</span>
    <button type="button" class="menu__close" data-menu-close aria-label="Close menu">✕</button>
  </div>
  <nav class="menu__nav" aria-label="Main (mobile)">
    {%- for item in site.data.nav -%}
    <a href="{{ item.url | relative_url }}"{% if page.section == item.section %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {%- endfor -%}
  </nav>
  <div class="menu__foot">
    <a href="{{ site.social.github_url }}">GitHub</a>
    <a href="{{ site.social.linkedin_url }}">LinkedIn</a>
    <a href="{{ site.social.medium_url }}">Medium</a>
    <span class="menu__copy">© {{ site.time | date: "%Y" }}</span>
  </div>
</div>
