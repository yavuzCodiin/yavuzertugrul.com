<aside class="sidebar">
  <div class="sidebar__inner">
    <div class="sidebar__top">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand__name">Yavuz<br>Ertuğrul</span>
        <span class="brand__kicker">{{ site.tagline }}</span>
      </a>
      {% include theme-toggle.html %}
    </div>

    <nav class="sidebar__nav" aria-label="Main">
      {%- for item in site.data.nav -%}
      <a href="{{ item.url | relative_url }}"{% if page.section == item.section %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {%- endfor -%}
    </nav>

    <div class="sidebar__foot">Yavuz Ertuğrul — © {{ site.time | date: "%Y" }}</div>
  </div>
</aside>
