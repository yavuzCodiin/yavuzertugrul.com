<div class="booknote" id="book-note" role="dialog" aria-modal="true" aria-labelledby="book-note-title" hidden>
  <div class="booknote__panel">
    <div class="booknote__head">
      <span class="booknote__kicker">Book note</span>
      <button type="button" class="booknote__close" data-booknote-close aria-label="Close">✕</button>
    </div>
    <div class="booknote__body">
      <img class="booknote__cover" id="book-note-cover" src="" alt="">
      <div>
        <p class="booknote__title" id="book-note-title"></p>
        <p class="booknote__author" id="book-note-author"></p>
        <span class="rating" id="book-note-rating" aria-label="Rating"></span>
        <p class="booknote__note" id="book-note-text"></p>
      </div>
    </div>
  </div>
</div>
